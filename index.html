<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz San Valentín ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f0f14, #1a0f1f);
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

.hearts {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.heart {
  position: absolute;
  color: rgba(255, 0, 90, 0.15);
  font-size: 24px;
  animation: float 10s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) scale(1); }
  100% { transform: translateY(-10vh) scale(1.5); }
}

.container {
  width: 95%;
  max-width: 900px;
  text-align: center;
  z-index: 1;
  align-items: center;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  margin-bottom: 10px;
  color: #ff4d88;
}

.video-wrapper {
  position: relative;
  width: 100%;
  background: #000;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(255, 0, 100, 0.3);
  align-items: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.message {
  margin-top: 15px;
  font-size: 1.3rem;
  color: #ccc;
  opacity: 0.8;
}

@media (max-width: 768px) {
  h1 {
    font-size: 1.8rem;
  }

  .message {
    font-size: 1rem;
  }
}

  </style>
</head>
<body>  <div class="hearts">
    <div class="heart" style="left:10%; animation-delay: 0s;">❤</div>
    <div class="heart" style="left:25%; animation-delay: 2s;">❤</div>
    <div class="heart" style="left:40%; animation-delay: 4s;">❤</div>
    <div class="heart" style="left:60%; animation-delay: 1s;">❤</div>
    <div class="heart" style="left:75%; animation-delay: 3s;">❤</div>
    <div class="heart" style="left:90%; animation-delay: 5s;">❤</div>
  </div>  <div class="container">
    <h1>Feliz San Valentín Bel ❤️</h1><div class="video-wrapper">
  <video controls autoplay>
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta video HTML5.
  </video>
</div>

<div class="message">
  Este es solo un pequeño recordatorio de cuánto te quiero 💕
</div>

  </div></body>
</html>
